<div class="flex flex-col h-full">
    <!-- HEADER CHAT -->
    <div class="bg-gray-800 rounded-t-lg p-4 border-b border-gray-700">
        <h2 class="text-lg font-semibold">🤖 Analizador Político IA</h2>
        <p class="text-sm text-gray-400">Pega una noticia o texto político para analizarlo</p>
    </div>

    <!-- CHAT -->
    <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-900">
        <div class="bot-message">
            👋 ¡Bienvenido! Pega una noticia, discurso o texto político y lo analizaré en 5 dimensiones.
        </div>
    </div>

    <!-- INPUT -->
    <div class="bg-gray-800 rounded-b-lg p-4">
        <div class="flex gap-2">
            <textarea 
                id="mensaje" 
                class="flex-1 p-2 rounded-lg bg-gray-700 border border-gray-600 resize-none"
                rows="2"
                placeholder="Escribe o pega una noticia..."
            ></textarea>
            <button 
                id="enviarBtn"
                onclick="enviarMensaje()"
                class="bg-teal-600 hover:bg-teal-700 px-4 rounded-lg"
            >
                ↑
            </button>
        </div>
        <p class="text-xs text-gray-500 mt-2 text-center">
            Al enviar, aceptas que el análisis será procesado por IA
        </p>
    </div>
</div>
